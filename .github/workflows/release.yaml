      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: dist/installer/linux-64/*
          retention-days: 1

  publish-release-assets:
    runs-on: ubuntu-latest
    needs:
      - build-and-publish-conda
      - publish-installer-windows
      - publish-installer-linux

    steps:
      - name: Download conda packages
        uses: actions/download-artifact@v4
        with:
          pattern: conda-packages-*
          path: release-assets

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets/windows

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: linux-installer
          path: release-assets/linux

      - name: Show assets
        run: find release-assets -type f

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          token: ${{ secrets.GITHUB_TOKEN }}

  workflow-summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    if: always()

    needs:
    - build-and-publish-conda
    - publish-installer-windows
    - publish-installer-linux
    - publish-release-assets

    steps:
    - name: Generate Summary
      shell: bash
      run: |
        {
        echo "# Release Pipeline Summary"
        echo ""
        echo "| Job | Status |"
        echo "|------|--------|"
        echo "| Conda Package | ${{ needs.build-and-publish-conda.result }} |"
        echo "| Windows Installer | ${{ needs.publish-installer-windows.result }} |"
        echo "| Linux Installer | ${{ needs.publish-installer-linux.result }} |"
        echo "| Release Assets | ${{ needs.publish-release-assets.result }} |"
        echo ""
        echo "Generated: $(date -u)"
        } >> "$GITHUB_STEP_SUMMARY"
