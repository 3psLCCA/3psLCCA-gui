name: 3pslcca
channels:
  - conda-forge
  - osdag
  - zehen-249
  - nodefaults
  
dependencies:
  - python>=3.10,<3.13
  - pyside6<6.10
  - psutil
  - Pillow
  - matplotlib
  - pandas
  - numpy
  - openpyxl
  - PyYAML
  - pylatex
  - zehen-249::three-ps-lcca-core
  - osdag::osdag_latex_env
  - platformdirs
  - beautifulsoup4
  # Linux only; fontconfig 2.17/2.18 has a font-fallback crash (FcCharSetFindLeafForward) that
  # segfaults PySide6 apps using glyphs outside the active font's charset. See
  # devtools/dev_notes_log/3psLCCA_fontconfig_segfault_fix.md. environment.yml has no platform
  # selector syntax, so this pin is harmless-but-unnecessary on Windows.
  - fontconfig <2.17
  - pip:
    - pywebview
