name: 3pslcca
channels:
  - conda-forge
  - osdag
  - zehen-249
  - nodefaults
  
dependencies:
  - python>=3.10,<3.13
  - pip
  - pyside6>=6.11,!=6.11.3,<6.12  # keep in sync with pyproject.toml / requirements.txt; 6.11.3 drops QSpinBox padding (QTBUG-151308)
  - psutil
  - Pillow
  - matplotlib
  - pandas
  - numpy
  - openpyxl
  - PyYAML
  - pylatex
  - zehen-249::three-ps-lcca-core
  - osdag::osdag_latex_env
  - platformdirs
  - beautifulsoup4
  - odfpy
  # Linux only; fontconfig 2.18.1 has a font-fallback crash (FcCharSetFindLeafForward) that
  # segfaults PySide6 apps using glyphs outside the active font's charset. See
  # devtools/dev_notes_log/3psLCCA_fontconfig_segfault_fix.md. Qt 6.11 needs >=2.18.3, which
  # also skips 2.18.1. environment.yml has no platform selector syntax; harmless on Windows.
  - fontconfig >=2.18.3
  - pip:
    - pywebview
